name: Sync Pipefy Data

# Sempre busca TODAS as fases (ativas + finalizadas) para garantir
# que cotações aprovadas/reprovadas nunca fiquem de fora do painel.

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 08h Brasília (UTC-3), seg-sex
    - cron: '0 17 * * 1-5'   # 14h Brasília (UTC-3), seg-sex
  workflow_dispatch:           # disparo manual pelo GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar dados do Pipefy
        env:
          PIPEFY_TOKEN:      ${{ secrets.PIPEFY_TOKEN }}
          PIPE_COTACOES_ID:  ${{ secrets.PIPE_COTACOES_ID }}
          PIPE_COMPRAS_ID:   ${{ secrets.PIPE_COMPRAS_ID }}
          PIPE_LOGISTICA_ID: ${{ secrets.PIPE_LOGISTICA_ID }}
        run: node fetch-data.js

      - name: Commit e push do data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sem mudanças, nenhum commit necessário."
          else
            git commit -m "chore: sync Pipefy $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Push com force-with-lease: seguro para data.json gerado sempre do zero
            git push --force-with-lease
          fi
